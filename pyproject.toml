[project]
name = "playgrounds"
version = "0.1.0"
description = "A lightweight desktop AI playground built with PyQt6"
requires-python = ">=3.10"
dependencies = [
  "PyQt6>=6.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyinstaller>=6",
  "pillow>=10",
]

[project.gui-scripts]
playgrounds = "app.main:main"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["dist", "build/installer", "*.spec"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
