name: Windows Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag matching pyproject.toml (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'baaaaan1/Playgrounds'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "dependency install failed" }
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "WiX install failed" }
      - name: Test and build release assets
        shell: pwsh
        run: ./build/build.ps1 -Installer -ReleaseTag $env:RELEASE_TAG
      - name: Verify MSI installation, repair, and removal
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = (Get-Item dist/release/Playgrounds-*-x64.msi).FullName
          $exe = Join-Path $env:LOCALAPPDATA "Playgrounds/Playgrounds.exe"
          $shortcut = Join-Path $env:APPDATA "Microsoft/Windows/Start Menu/Programs/Playgrounds/Playgrounds.lnk"
          $data = Join-Path $env:APPDATA "Playgrounds/conversations"
          [System.IO.Directory]::CreateDirectory($data) | Out-Null
          $marker = Join-Path $data ".release-verification"
          $sentinel = [guid]::NewGuid().ToString()
          [System.IO.File]::WriteAllText($marker, $sentinel)
          try {
            foreach ($operation in @("/i", "/fa", "/x")) {
              $log = Join-Path $env:RUNNER_TEMP "playgrounds-msi-$($operation.Substring(1)).log"
              $result = Start-Process msiexec.exe -ArgumentList "$operation `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
              if ($result.ExitCode -notin @(0, 3010)) { throw "MSI $operation failed: $($result.ExitCode); see $log" }
              if ([System.IO.File]::ReadAllText($marker) -ne $sentinel) { throw "MSI modified user conversation data" }
              if ($operation -eq "/x") {
                if ((Test-Path $exe) -or (Test-Path $shortcut)) { throw "MSI uninstall left the application or shortcut behind" }
              } else {
                if (-not ((Test-Path $exe) -and (Test-Path $shortcut))) { throw "MSI did not install the application and Start Menu shortcut" }
                python -c "import subprocess, sys; sys.exit(subprocess.run([sys.argv[1], '--smoke-native'], timeout=30).returncode)" $exe
                if ($LASTEXITCODE -ne 0) { throw "Installed application smoke test failed" }
              }
            }
          } finally {
            Remove-Item -LiteralPath $marker -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release
      - name: Verify release checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Create draft for manual verification
        shell: bash
        run: |
          notes_file="build/release-notes/${RELEASE_TAG#v}.md"
          if [ ! -s "$notes_file" ]; then
            echo "Release notes are missing or empty: $notes_file"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists. Refusing to replace existing assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --draft \
            --title "Playgrounds $RELEASE_TAG" \
            --notes-file "$notes_file"
