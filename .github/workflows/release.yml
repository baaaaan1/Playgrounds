name: Windows Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag matching pyproject.toml (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'baaaaan1/Playgrounds'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "dependency install failed" }
          dotnet tool install --global wix --version 7.0.1
          if ($LASTEXITCODE -ne 0) { throw "WiX install failed" }
      - name: Test and build release assets
        shell: pwsh
        run: ./build/build.ps1 -Installer -ReleaseTag $env:RELEASE_TAG
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release
      - name: Verify release checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Create draft for manual verification
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists. Refusing to replace existing assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --draft --generate-notes \
            --title "Playgrounds $RELEASE_TAG" \
            --notes 'Windows x64 MSI. This build is unsigned. Verify SHA256SUMS.txt before installation. Maintainer: test clean install, launch, upgrade, uninstall, and review bundled licenses and corresponding source before publishing this draft.'
